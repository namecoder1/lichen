# Sito informativo su GitHub Pages (https://namecoder1.github.io/lichen/).
# Pagina in site/, immagini prese da docs/images e dalle anteprime dei temi.
# Attivazione una tantum: Settings → Pages → Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/images/**", "Resources/thumbs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Pages gratuito solo per i repo pubblici
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepara il sito
        run: |
          mkdir -p _site/images
          cp -R site/. _site/
          cp docs/images/*.jpg _site/images/
          cp Resources/thumbs/beach.webp Resources/thumbs/meadow.webp _site/images/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
