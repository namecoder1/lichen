# Website on GitHub Pages (https://namecoder1.github.io/lichen/).
# Page in site/, images from docs/images and the theme thumbnails.
# One-time setup: Settings → Pages → Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/images/**", "Resources/thumbs/**", "Resources/themes/lichen/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Pages is free for public repositories only
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site/images
          cp -R site/. _site/
          cp docs/images/*.jpg _site/images/
          cp Resources/thumbs/beach.webp Resources/thumbs/meadow.webp _site/images/
          # Lichen themes for the live demo (Lichen's own only, not the Deskland ones)
          mkdir -p _site/themes
          cp Resources/themes/lichen/*.html Resources/themes/lichen/core.js _site/themes/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
