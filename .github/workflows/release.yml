# Publishes a release when you push a vX.Y.Z tag:
#   git tag v0.1.0 && git push origin v0.1.0
# A tag with a hyphen (v0.4.0-rc.1) creates a test pre-release: no tap update, and Sparkle
# doesn't see it (latest/download always points to the latest stable release).
#
# Optional secrets (Settings → Secrets and variables → Actions):
#   signing + notarization: MACOS_CERT_P12 (base64 of the Developer ID .p12), MACOS_CERT_PASSWORD,
#                           SIGN_IDENTITY, APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD
#   tap update:             HOMEBREW_TAP_TOKEN (PAT with write access to the tap repository)
#   Sparkle updates:        SPARKLE_PRIVATE_KEY (from `generate_keys -x`; the public key is in scripts/config.sh)
# Without secrets: ad-hoc signed build, release created, tap not updated.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Import the Developer ID certificate
        if: env.MACOS_CERT_P12 != ''
        env:
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KC_PASS="$(uuidgen)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"

      - name: Build, sign and (when possible) notarize
        env:
          SIGN_IDENTITY: ${{ env.MACOS_CERT_P12 != '' && secrets.SIGN_IDENTITY || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: scripts/build-app.sh "${GITHUB_REF_NAME#v}"

      - name: Appcast for automatic updates
        if: env.SPARKLE_PRIVATE_KEY != ''
        run: scripts/make-appcast.sh "${GITHUB_REF_NAME#v}"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES=(dist/*.zip)
          [[ -f dist/appcast.xml ]] && FILES+=(dist/appcast.xml)
          PRE=(); [[ "$GITHUB_REF_NAME" == *-* ]] && PRE=(--prerelease)
          # notes: the "## [X.Y.Z]" section of CHANGELOG.md if present; otherwise GitHub's generated notes
          V="${GITHUB_REF_NAME#v}"
          awk -v v="$V" '/^## \[/{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md > "$RUNNER_TEMP/notes.md" || true
          if [[ -s "$RUNNER_TEMP/notes.md" ]]; then NOTES=(--notes-file "$RUNNER_TEMP/notes.md"); else NOTES=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" "${FILES[@]}" --title "Lichen $V" "${NOTES[@]}" "${PRE[@]}"

      - name: Update the Homebrew tap
        if: env.HOMEBREW_TAP_TOKEN != '' && !contains(github.ref_name, '-')
        run: |
          source scripts/config.sh
          VERSION="${GITHUB_REF_NAME#v}"
          SHA="$(shasum -a 256 "dist/$APP_NAME-$VERSION.zip" | cut -d' ' -f1)"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/$TAP_REPO.git" tap
          mkdir -p tap/Casks
          scripts/make-cask.sh "$VERSION" "$SHA" > "tap/Casks/$CASK.rb"
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Casks/$CASK.rb"
          git commit -m "$CASK $VERSION"
          git push origin HEAD:main
