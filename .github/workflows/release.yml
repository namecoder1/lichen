# Pubblica una release quando fai push di un tag vX.Y.Z:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Secrets opzionali (Settings → Secrets and variables → Actions):
#   firma + notarizzazione: MACOS_CERT_P12 (base64 del .p12 Developer ID), MACOS_CERT_PASSWORD,
#                           SIGN_IDENTITY, APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD
#   aggiornamento tap:      HOMEBREW_TAP_TOKEN (PAT con accesso in scrittura al repo del tap)
#   aggiornamenti Sparkle:  SPARKLE_PRIVATE_KEY (da `generate_keys -x`; la pubblica è in scripts/config.sh)
# Senza secrets: build firmata ad-hoc, release creata, tap non aggiornato.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Importa il certificato Developer ID
        if: env.MACOS_CERT_P12 != ''
        env:
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KC_PASS="$(uuidgen)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"

      - name: Compila, firma e (se possibile) notarizza
        env:
          SIGN_IDENTITY: ${{ env.MACOS_CERT_P12 != '' && secrets.SIGN_IDENTITY || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: scripts/build-app.sh "${GITHUB_REF_NAME#v}"

      - name: Appcast per gli aggiornamenti automatici
        if: env.SPARKLE_PRIVATE_KEY != ''
        run: scripts/make-appcast.sh "${GITHUB_REF_NAME#v}"

      - name: Crea la GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES=(dist/*.zip)
          [[ -f dist/appcast.xml ]] && FILES+=(dist/appcast.xml)
          gh release create "$GITHUB_REF_NAME" "${FILES[@]}" --title "$GITHUB_REF_NAME" --generate-notes

      - name: Aggiorna il tap Homebrew
        if: env.HOMEBREW_TAP_TOKEN != ''
        run: |
          source scripts/config.sh
          VERSION="${GITHUB_REF_NAME#v}"
          SHA="$(shasum -a 256 "dist/$APP_NAME-$VERSION.zip" | cut -d' ' -f1)"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/$TAP_REPO.git" tap
          mkdir -p tap/Casks
          scripts/make-cask.sh "$VERSION" "$SHA" > "tap/Casks/$CASK.rb"
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Casks/$CASK.rb"
          git commit -m "$CASK $VERSION"
          git push
