<body>
<script src="core.js"></script>
<script>
'use strict';
const MAX_PARTS = 5;
Lichen.start({
  background: '#164a8a',
  sigma: 26, warp: 0, coast: 0.6,
  animated: false,                 // statico: zero consumi a riposo
  params: { parts: { def: 5 }, grid: { def: 1 } },
  // "disegni tecnici" sparsi negli spazi vuoti: cerchi quotati, ingranaggi stilizzati
  place(api) {
    api.state.parts = api.scatter(6, Math.round(api.P.parts), { fromIcons: 260, apart: 320, margin: 140 })
      .map(o => [o.x, o.y, 40 + o.r * 50, o.k]);
  },
  uniforms(gl, u, now, api) {
    const pt = api.state.parts || [], a = new Float32Array(MAX_PARTS * 4);
    pt.forEach((o, i) => a.set(o, i * 4));
    gl.uniform4fv(u('uPart'), a); gl.uniform1i(u('uPartN'), pt.length);
  },

  fragment: `
#define MAXP ${MAX_PARTS}
uniform vec4 uPart[MAXP];
uniform int uPartN;
const vec3 INK = vec3(0.86, 0.93, 1.0);

float hline(float v, float w) { return aaline(v, w); }

void main() {
  vec2 p = cssPos();
  // carta blu con leggera vignettatura e grana
  vec3 col = mix(vec3(0.07, 0.27, 0.53), vec3(0.10, 0.32, 0.60), tex(p, 600.0).r);
  col *= 1.0 - 0.18 * smoothstep(0.4, 1.0, length((p / uView - 0.5) * vec2(1.2, 1.0)));
  col *= 0.97 + 0.04 * hash12(floor(p * uScale));
  // griglia millimetrata
  vec2 g1 = abs(mod(p + 6.0, 12.0) - 6.0), g5 = abs(mod(p + 30.0, 60.0) - 30.0);
  col = mix(col, INK, (1.0 - smoothstep(0.0, 0.8, min(g1.x, g1.y))) * 0.07 * uP_grid);
  col = mix(col, INK, (1.0 - smoothstep(0.0, 1.0, min(g5.x, g5.y))) * 0.16 * uP_grid);

  // contorni attorno alle icone: profilo pieno, offset tratteggiato
  float s = fieldS(p);
  vec2 gr = fieldGrad(p);
  float ang = atan(gr.y, gr.x);
  col = mix(col, INK, aaline(s - 4.0, 1.4) * 0.9);
  float dash = step(0.5, fract(ang * 9.0 / 6.2832 * 4.0));
  col = mix(col, INK, aaline(s - 22.0, 1.0) * dash * 0.7);

  // segni di centro e quote per ogni icona
  for (int i = 0; i < 64; i++) {
    if (i >= uIconN) break;
    vec4 ic = uIcon[i];
    vec2 c = vec2(ic.x, ic.y - ic.w * 0.0);
    vec2 q = p - c;
    if (abs(q.x) > ic.z + 30.0 || abs(q.y) > ic.w + 30.0) continue;
    float cross = (aaline(q.x, 0.8) * step(abs(q.y), 6.0) + aaline(q.y, 0.8) * step(abs(q.x), 6.0));
    col = mix(col, INK, clamp(cross, 0.0, 1.0) * 0.35);
  }

  // disegni tecnici sparsi
  for (int i = 0; i < MAXP; i++) {
    if (i >= uPartN) break;
    vec4 pt = uPart[i];
    vec2 q = p - pt.xy;
    float R = pt.z;
    if (length(q) > R * 1.9) continue;
    float r = length(q), a = atan(q.y, q.x);
    float teeth = 10.0 + floor(fract(pt.w) * 8.0);
    float outer = R + 4.0 * smoothstep(-0.2, 0.2, sin(a * teeth));
    float l = aaline(r - outer, 1.3) + aaline(r - R * 0.38, 1.2) + aaline(r - R * 0.7, 0.8) * step(0.5, fract(a * 6.0));
    // assi
    l += (aaline(q.x, 0.7) * step(r, R * 1.35) + aaline(q.y, 0.7) * step(r, R * 1.35)) * step(0.4, fract(r * 0.06));
    // quota del diametro sotto il pezzo
    float dy = q.y - R * 1.55;
    l += aaline(dy, 0.8) * step(abs(q.x), R) + (aaline(q.x - R, 0.8) + aaline(q.x + R, 0.8)) * step(abs(dy), 5.0);
    col = mix(col, INK, clamp(l, 0.0, 1.0) * 0.75);
  }

  // cornice doppia con il cartiglio in basso a destra
  vec2 m = min(p, uView - p);
  float frame = aaline(min(m.x, m.y) - 12.0, 1.0) + aaline(min(m.x, m.y) - 18.0, 2.0);
  vec2 tb = uView - p - vec2(18.0);
  float title = (aaline(tb.x - 220.0, 1.0) * step(tb.y, 70.0) + aaline(tb.y - 70.0, 1.0) * step(tb.x, 220.0)
              + aaline(tb.y - 35.0, 0.8) * step(tb.x, 220.0) + aaline(tb.x - 110.0, 0.8) * step(tb.y, 35.0)) * step(0.0, tb.x) * step(0.0, tb.y);
  col = mix(col, INK, clamp(frame + title, 0.0, 1.0) * 0.8);
  col = mix(col, INK, rippleRing(p) * 0.65);
  outColor = vec4(col, 1.0);
}`,
});
</script>
</body></html>
