<html lang="it"><head><meta charset="utf-8"><title>Lichen · Barriera corallina</title></head>
<body>
<script src="core.js"></script>
<script>
'use strict';
const COMMON = `
#define REEF uP_reef            // larghezza della fascia di coralli attorno al banco di sabbia
`;

Lichen.start({
  background: '#1b7fa0',
  sigma: 60, warp: 36, coast: 1.0,
  animated: true,
  params: { fish: { def: 4 }, reef: { def: 80 } },
  // piccoli banchi di coralli isolati nel blu
  extraRects(api) {
    return api.scatter(1, 5, { fromIcons: 280, apart: 300 })
      .map(o => ({ cx: o.x, cy: o.y, hw: 2 + o.r * 6, hh: 2 + o.r * 5 }));
  },

  staticFragment: COMMON + `
vec3 coral(vec3 v, vec2 p) {
  float k = fract(tex(p, 220.0).r * 2.5 + v.z * 0.22 + uSeed * 0.13);   // colori che cambiano a zone
  vec3 c = k < 0.2 ? vec3(0.95, 0.45, 0.50) :
           k < 0.4 ? vec3(0.98, 0.62, 0.30) :
           k < 0.55 ? vec3(0.62, 0.40, 0.78) :
           k < 0.7 ? vec3(0.95, 0.85, 0.40) :
           k < 0.85 ? vec3(0.30, 0.72, 0.62) : vec3(0.85, 0.30, 0.35);
  // tre forme: cervello (solchi), ramificato (macchie), a ventaglio (raggi)
  float pattern;
  if (fract(k * 7.0) < 0.33) pattern = 0.5 + 0.5 * sin(tex(p, 14.0).r * 40.0);
  else if (fract(k * 7.0) < 0.66) pattern = smoothstep(0.4, 0.7, tex(p, 9.0).g);
  else pattern = 0.5 + 0.5 * sin(atan(p.y, p.x) * 0.0 + v.x * 30.0);
  c *= 0.75 + 0.35 * pattern;
  c *= 1.0 - 0.35 * smoothstep(0.3, 0.8, v.x);       // bordo della colonia più scuro
  return c;
}

void main() {
  vec2 p = cssPos();
  float s = fieldS(p);
  float sN = s + (tex(p, 80.0).r - 0.5) * 12.0;

  // fondale di sabbia con increspature
  vec3 sand = vec3(0.95, 0.91, 0.80);
  sand *= 0.95 + 0.06 * sin(dot(p, vec2(0.12, 0.05)) + tex(p, 120.0).g * 8.0);
  sand *= 0.95 + 0.07 * hash12(floor(p * uScale / 1.5));

  // profondità: chiaro sopra il banco, blu profondo lontano
  float depth = smoothstep(-10.0, 260.0, sN);
  vec3 water = mix(vec3(0.30, 0.86, 0.85), vec3(0.03, 0.38, 0.62), depth);
  water = mix(water, vec3(0.02, 0.24, 0.48), smoothstep(200.0, 300.0, sN));
  vec3 col = mix(sand * vec3(0.78, 0.97, 0.96), water, smoothstep(0.0, 1.0, depth) * 0.85 + 0.12);

  // coralli: colonie (celle) più fitte vicino al banco
  float density = 1.0 - smoothstep(0.0, REEF, sN);
  density *= step(-6.0, sN);
  if (density > 0.0) {
    vec2 wp = p + (vec2(tex(p, 40.0).r, tex(p, 40.0).g) - 0.5) * 10.0;   // bordi organici
    vec3 v = voronoi(wp / 17.0 + uSeed);
    float present = step(1.0 - density * 1.1, hash12(vec2(v.z * 31.0, 2.0)));
    float blob = smoothstep(0.78, 0.5, v.x) * present;
    vec3 cc = coral(v, p);
    // le colonie più profonde si confondono con l'acqua
    cc = mix(cc, water, smoothstep(0.0, REEF, sN) * 0.45);
    col *= 1.0 - 0.25 * smoothstep(0.9, 0.55, voronoi(wp / 17.0 + uSeed + vec2(-0.1, -0.14)).x) * present;
    col = mix(col, cc, blob);
  }
  // alghe sparse sul fondale profondo
  float weed = step(0.93, hash12(floor(p / 18.0) + uSeed)) * smoothstep(0.3, 0.1, length(fract(p / 18.0) - 0.5));
  col = mix(col, vec3(0.08, 0.40, 0.36), weed * smoothstep(40.0, 120.0, sN) * 0.6);
  outColor = vec4(col, 1.0 - depth);     // maschera: quanto è bassa l'acqua (caustiche più forti)
}`,

  fragment: COMMON + `
float fishShape(vec2 q, float len) {
  float body = length(q / vec2(len, len * 0.38));
  vec2 tq = q + vec2(len * 1.15, 0.0);
  float tail = max(abs(tq.y) - (len * 0.55 - abs(tq.x) * 1.4), abs(tq.x) - len * 0.35);
  return max(smoothstep(1.05, 0.85, body), smoothstep(0.6, -0.4, tail));
}

void main() {
  vec2 p = cssPos();
  vec4 st = staticTexel();
  vec3 col = st.rgb;
  float t = uTime;

  // caustiche: rete luminosa che ondeggia sul fondale
  float c1 = tex(p + vec2(t * 7.0, t * 3.0), 95.0).r;
  float c2 = tex(p * 1.1 - vec2(t * 4.0, -t * 6.0), 120.0).g;
  float web = smoothstep(0.06, 0.0, abs(c1 - c2));
  col += web * (0.06 + 0.14 * st.a) * vec3(0.9, 1.0, 1.0);

  // banchi di pesci
  for (int sc = 0; sc < 4; sc++) {
    float fs = float(sc);
    vec2 h = hash22(vec2(fs * 5.3, uSeed));
    float sp = 0.06 + h.x * 0.05;
    vec2 center = vec2(0.5 + 0.38 * sin(t * sp + fs * 2.1), 0.5 + 0.36 * sin(t * sp * 0.8 + fs * 1.3)) * uView;
    vec2 vel = normalize(vec2(cos(t * sp + fs * 2.1) * 0.38 * uView.x, cos(t * sp * 0.8 + fs * 1.3) * 0.36 * 0.8 * uView.y) + 1e-4);
    if (fs >= uP_fish || length(p - center) > 80.0) continue;
    vec3 fc = sc == 0 ? vec3(1.0, 0.86, 0.20) : sc == 1 ? vec3(0.25, 0.45, 0.95) : sc == 2 ? vec3(1.0, 0.55, 0.15) : vec3(0.92, 0.92, 0.98);
    float a = atan(vel.y, vel.x);
    for (int i = 0; i < 9; i++) {
      float fi = float(i);
      vec2 o = (hash22(vec2(fi, fs + 9.0)) - 0.5) * 90.0;
      o += vec2(sin(t * 1.7 + fi), cos(t * 1.3 + fi * 2.0)) * 4.0;
      vec2 q = rot(-a) * (p - center - o);
      q.y += sin(q.x * 0.5 + t * 9.0 + fi) * 0.6;          // coda che si muove
      vec2 qs = rot(-a) * (p - center - o - vec2(7.0, 9.0));
      col *= 1.0 - 0.18 * fishShape(qs, 7.5);              // ombra sul fondale
      float f = fishShape(q, 7.5);
      vec3 c = fc;
      if (sc == 2) c = mix(c, vec3(1.0), step(0.6, fract(q.x * 0.25 + 0.3)));   // pesce pagliaccio
      col = mix(col, c * (0.85 + 0.25 * smoothstep(-2.0, 2.0, -q.y)), f);
    }
  }
  col += rippleRing(p) * 0.22 * vec3(0.9, 1.0, 1.0);
  outColor = vec4(col, 1.0);
}`,
});
</script>
</body></html>
